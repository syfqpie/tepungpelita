repos:
-   repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.1.0
    hooks:
    -   id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, refactor, perf, test, docs, style, build, ci, chore, revert] # optional: list of Conventional Commits types to allow e.g. [feat, fix, ci, chore, test]
