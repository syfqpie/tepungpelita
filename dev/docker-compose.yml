services:
  directus:
    container_name: koci.dev.directus
    image: directus/directus:12
    ports:
      - 8055:8055
    volumes:
      - ./database:/directus/database
      - ./uploads:/directus/uploads
      - ../extensions:/directus/extensions
    env_file:
      - .env
    environment:
      EXTENSIONS_AUTO_RELOAD: true
    networks:
      - koci.dev.network

networks:
  koci.dev.network:
    driver: bridge